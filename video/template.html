      <div id="sub"><span id="subtx"></span></div>
      <div id="bar"><div class="l px"><i></i>AI 像素擂台</div><div class="r px">第 1 集 · 贪吃蛇大乱斗</div></div>
      <audio id="mix" src="assets/audio/mix.wav" data-start="0" data-duration="__DURATION__" data-track-index="9" data-volume="1"></audio>
    </div>
    <script>
      __BOARD_JS__
    </script>
    <script>
      const PLAN = __PLAN__;
      const GAMES = __GAMES__;
      const DEMOS = __DEMOS__;
      const CAST = PLAN.cast;
      const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
      const ease = (x) => { x = clamp(x, 0, 1); return 1 - Math.pow(1 - x, 3); };
      const back = (x) => { x = clamp(x, 0, 1); const c = 1.70158; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
      const $ = (id) => document.getElementById(id);
      const fmt = (n) => Math.round(n).toLocaleString("en-US");

      function inAt(el, lt, at, dur = 0.35, dy = 30) {
        if (!el) return;
        const k = ease((lt - at) / dur);
        el.style.opacity = k;
        el.style.transform = `translateY(${(1 - k) * dy}px)`;
      }
      function pop(el, lt, at, dur = 0.4) {
        if (!el) return;
        const k = (lt - at) / dur;
        el.style.opacity = clamp(k * 3, 0, 1);
        el.style.transform = `scale(${lt < at ? 0.6 : 0.6 + 0.4 * back(k)})`;
      }
      function typed(el, text, lt, at, cps) {
        if (!el) return;
        const n = clamp(Math.floor((lt - at) * cps), 0, text.length);
        el.textContent = text.slice(0, n);
      }

      // ---- 每种场景的画法：只依赖本场景内的时间 lt ----
      const R = {};
      R.title = (s, lt) => {
        inAt($(s.id + "-logo"), lt, 0.2, 0.5, 60);
        inAt($(s.id + "-sub"), lt, 0.8, 0.4, 30);
        s.cast.forEach((c, i) => {
          const el = $(`${s.id}-c${i}`);
          const at = s.light[i];
          const k = clamp((lt - at) / 0.3, 0, 1);
          el.style.opacity = 0.18 + 0.82 * k;
          el.style.filter = k < 1 ? `brightness(${0.3 + 0.7 * k}) saturate(${k})` : "none";
          const hop = lt > at && lt < at + 0.35 ? Math.sin((lt - at) / 0.35 * Math.PI) * 26 : 0;
          el.style.transform = `translateY(${-hop}px)`;
        });
        inAt($(s.id + "-foot"), lt, s.foot_at, 0.4, 20);
      };
      R.demo = (s, lt) => {
        const fr = DEMOS[s.demo];
        const k = clamp(Math.floor((lt - s.play_at) * s.rate), 0, fr.length - 1);
        const f = fr[Math.max(0, k)];
        const cv = $(s.id + "-cv"), ctx = cv.getContext("2d");
        ctx.clearRect(0, 0, cv.width, cv.height);
        const g = { w: s.w, turns: 0, heads: [], vis: [], death: [], food: [[0, f.food]] };
        // 演示帧直接带完整身体：借 drawBoard 画地面和食物，蛇自己画
        drawBoard(ctx, g, 0, { cell: s.cell, ox: s.cell / 2, oy: s.cell / 2, colors: [] });
        f.bodies.forEach((b, i) => { if (b) window.drawSnakeBody(ctx, b, s.colors[i], s.cell, s.cell / 2, s.cell / 2, 1); });
        // 死亡标记
        if (k > 0) fr[k].dead.forEach((d, i) => {
          if (!d) return;
          const prev = fr.slice(0, k).reverse().find((x) => x.bodies[i]);
          if (!prev) return;
          window.drawSnakeBody(ctx, prev.bodies[i], "#6b7280", s.cell, s.cell / 2, s.cell / 2, 0.5);
        });
        s.items.forEach((it, i) => {
          const el = $(`${s.id}-i${i}`);
          inAt(el, lt, it.at, 0.3, 16);
          el.classList.toggle("on", lt >= it.at && (i === s.items.length - 1 || lt < s.items[i + 1].at));
        });
        if (s.hp) {
          const hp = f.hp[0];
          $(s.id + "-hpv").textContent = `生命值 ${hp}`;
          $(s.id + "-hpf").style.width = `${hp / s.hp_max * 100}%`;
          $(s.id + "-hpf").style.background = hp > s.hp_max * 0.4 ? "#4ade80" : "#ff4b4b";
        }
      };
      R.list = (s, lt) => { s.items.forEach((it, i) => inAt($(`${s.id}-i${i}`), lt, it.at, 0.35, 20)); inAt($(s.id + "-h"), lt, 0.1, 0.35, 20); };
      R.doc = (s, lt) => {
        const body = $(s.id + "-body");
        const y = s.scroll ? -clamp((lt - s.scroll[0]) / (s.scroll[1] - s.scroll[0]), 0, 1) * s.scroll[2] : 0;
        body.style.transform = `translateY(${y}px)`;
        s.keys.forEach((k, i) => inAt($(`${s.id}-k${i}`), lt, k.at, 0.35, 20));
      };
      R.intro = (s, lt) => {
        const por = $(s.id + "-por");
        const k = ease(lt / 0.5);
        por.style.opacity = k; por.style.transform = `translateX(${(1 - k) * -80}px)`;
        inAt($(s.id + "-card"), lt, 0.25, 0.4, 30);
        s.facts.forEach((f, i) => inAt($(`${s.id}-f${i}`), lt, f.at, 0.3, 14));
        const bob = Math.round(Math.sin(lt * 2.4) * 4);
        $(s.id + "-img").style.transform = `translateY(${bob}px)`;
      };
      R.bars = (s, lt) => {
        inAt($(s.id + "-h"), lt, 0.05, 0.3, 16);
        s.rows.forEach((r, i) => {
          const at = s.row_at[i];
          inAt($(`${s.id}-r${i}`), lt, at, 0.3, 12);
          const k = ease((lt - at) / 0.6);
          $(`${s.id}-b${i}`).style.width = `${r.w * k}px`;
          $(`${s.id}-v${i}`).textContent = lt < at ? "" : (r.label_fixed || (s.prefix || "") + (r.dec ? (r.value * k).toFixed(r.dec) : fmt(r.value * k)) + (s.unit || ""));
        });
      };
      R.timeline = (s, lt) => {
        s.items.forEach((it, i) => {
          const el = $(`${s.id}-t${i}`);
          const k = (lt - it.at) / 0.45;
          el.style.opacity = clamp(k * 3, 0, 1);
          el.style.transform = `translateY(${lt < it.at ? -200 : -200 * (1 - back(k))}px)`;
        });
      };
      R.quote = (s, lt) => {
        const k = ease(lt / 0.4);
        $(s.id + "-por").style.opacity = k;
        inAt($(s.id + "-box"), lt, 0.15, 0.35, 20);
        typed($(s.id + "-tx"), s.text, lt, s.type_at, s.cps);
      };
      R.counter = (s, lt) => {
        const k = clamp((lt - s.count[0]) / (s.count[1] - s.count[0]), 0, 1);
        $(s.id + "-n").textContent = fmt(s.total * (1 - Math.pow(1 - k, 2)));
        inAt($(s.id + "-lab"), lt, 0.2, 0.4, 20);
        inAt($(s.id + "-sub"), lt, s.sub_at, 0.4, 20);
        s.minis.forEach((m, i) => {
          const cv = $(`${s.id}-m${i}`), ctx = cv.getContext("2d");
          const turn = clamp(lt * m.rate, 0, GAMES[m.game].turns);
          drawBoard(ctx, GAMES[m.game], turn, { cell: m.cell, ox: m.cell / 2, oy: m.cell / 2, colors: m.colors });
        });
      };
      function turnAt(s, lt) {
        let tr = s.segs[0][2];
        for (const [a, b, ta, tb] of s.segs) {
          if (lt < a) break;
          tr = lt >= b ? tb : ta + (tb - ta) * (lt - a) / (b - a);
        }
        return tr;
      }
      function speedAt(s, lt) {
        for (const g of s.segs) if (lt >= g[0] && lt < g[1]) return g[4] || "";
        return s.segs[s.segs.length - 1][4] || "";
      }
      R.match = (s, lt) => {
        const G = GAMES[s.game];
        const turn = turnAt(s, lt);
        const cv = $(s.id + "-cv"), ctx = cv.getContext("2d");
        drawBoard(ctx, G, turn, { cell: s.cell, ox: s.cell / 2, oy: s.cell / 2, colors: s.colors, focus: s.focus });
        $(s.id + "-turn").textContent = `第 ${Math.max(0, Math.floor(turn))} 回合 / ${G.turns}`;
        const sp = speedAt(s, lt);
        const spEl = $(s.id + "-sp");
        spEl.textContent = sp; spEl.style.display = sp ? "block" : "none";
        const alive = boardAlive(G, turn);
        s.order.forEach((seat, row) => {
          const L = boardLen(G, seat, turn), hp = boardHp(G, seat, turn);
          const r = $(`${s.id}-row${seat}`);
          $(`${s.id}-ln${seat}`).textContent = alive[seat] ? L : "";
          $(`${s.id}-hp${seat}`).style.width = alive[seat] ? `${hp}%` : "0%";
          $(`${s.id}-hp${seat}`).style.background = hp > 30 ? "#4ade80" : "#ff4b4b";
          $(`${s.id}-st${seat}`).textContent = alive[seat] ? "" : s.deaths[seat];
          r.style.opacity = alive[seat] ? 1 : 0.38;
        });
        // 长度走势
        if (s.chart) {
          const c2 = $(s.id + "-ch"), x = c2.getContext("2d");
          const W = c2.width, H = c2.height;
          x.clearRect(0, 0, W, H);
          x.fillStyle = "#0e1628"; x.fillRect(0, 0, W, H);
          x.strokeStyle = "#2a3a5e"; x.lineWidth = 2; x.strokeRect(1, 1, W - 2, H - 2);
          x.fillStyle = "#9aa8c7"; x.font = "22px AS"; x.fillText(s.chart_label, 14, 30);
          const maxL = s.chart_max, T = G.turns;
          for (const seat of s.chart) {
            x.strokeStyle = s.colors[seat]; x.lineWidth = 4; x.beginPath();
            const Ls = G.len[seat], end = Math.min(Math.floor(turn), Ls.length - 1);
            for (let t = 0; t <= end; t += Math.max(1, Math.floor(T / 400))) {
              const px = 14 + (W - 28) * t / T, py = H - 14 - (H - 54) * Ls[t] / maxL;
              t === 0 ? x.moveTo(px, py) : x.lineTo(px, py);
            }
            x.stroke();
          }
        }
        (s.callouts || []).forEach((c, i) => {
          const el = $(`${s.id}-co${i}`);
          const on = lt >= c.at && lt < c.until;
          el.style.opacity = on ? clamp((lt - c.at) * 5, 0, 1) : 0;
        });
      };
      R.rank = (s, lt) => {
        const por = $(s.id + "-por");
        if (s.silhouette) { por.style.filter = lt < s.reveal_at ? "brightness(0)" : "none"; }
        inAt(por, lt, 0.05, 0.4, 30);
        inAt($(s.id + "-no"), lt, 0.15, 0.3, 20);
        const shown = !s.silhouette || lt >= s.reveal_at;
        $(s.id + "-nm").style.opacity = shown ? ease((lt - (s.silhouette ? s.reveal_at : 0.3)) / 0.3) : 0;
        const ks = clamp((lt - (s.silhouette ? s.reveal_at : 0.5)) / 0.8, 0, 1);
        $(s.id + "-sc").textContent = shown ? (s.score >= 0 ? "+" : "−") + Math.round(Math.abs(s.score) * ease(ks)) + " 分" : "? 分";
        inAt($(s.id + "-ex"), lt, s.ex_at, 0.3, 14);
        s.marks.forEach((m, i) => {
          const el = $(`${s.id}-a${i}`);
          if (m.self) { el.style.opacity = lt >= (s.silhouette ? s.reveal_at : 0.6) ? 1 : 0; }
        });
      };
      R.podium = (s, lt) => {
        s.items.forEach((it, i) => inAt($(`${s.id}-p${i}`), lt, it.at, 0.5, 80));
      };
      R.table = (s, lt) => {
        inAt($(s.id + "-h"), lt, 0.05, 0.3, 16);
        s.row_at.forEach((at, i) => inAt($(`${s.id}-r${i}`), lt, at, 0.25, 10));
      };
      R.labels = (s, lt) => { s.items.forEach((it, i) => pop($(`${s.id}-l${i}`), lt, it.at)); };
      R.end = (s, lt) => {
        inAt($(s.id + "-t"), lt, 0.1, 0.4, 30);
        s.items.forEach((it, i) => inAt($(`${s.id}-i${i}`), lt, it.at, 0.35, 20));
        s.cast.forEach((c, i) => { const el = $(`${s.id}-c${i}`); const b = Math.sin(lt * 3 + i) * 5; el.style.transform = `translateY(${b}px)`; });
      };
      R.cold = (s, lt) => {
        const G = GAMES[s.game];
        const turn = turnAt(s, lt);
        const cv = $(s.id + "-cv"), ctx = cv.getContext("2d");
        drawBoard(ctx, G, turn, { cell: s.cell, ox: s.cell / 2, oy: s.cell / 2, colors: s.colors, focus: s.focus });
        drawBoardRing(ctx, G, turn, { cell: s.cell, ox: s.cell / 2, oy: s.cell / 2, ring: s.ring });
        s.lines.forEach((l, i) => inAt($(`${s.id}-a${i}`), lt, l.at, 0.3, 24));
        $(s.id + "-turn").textContent = `第 ${Math.floor(turn)} 回合`;
      };

      function render(t) {
        let cur = PLAN.scenes[0];
        for (const s of PLAN.scenes) if (t >= s.start) cur = s;
        const lt = t - cur.start;
        if (R[cur.type]) R[cur.type](cur, lt);
        // 字幕
        let sub = "";
        for (const c of PLAN.subs) { if (t >= c[0] && t < c[1]) { sub = c[2]; break; } }
        const st = $("subtx");
        st.textContent = sub; st.parentNode.style.opacity = sub ? 1 : 0;
        const chap = cur.chapter || "";
        $("chap").textContent = chap; $("chap").style.opacity = chap ? 1 : 0;
      }

      const tl = gsap.timeline({ paused: true });
      const clock = { t: 0 };
      tl.fromTo(clock, { t: 0 }, { t: PLAN.duration, duration: PLAN.duration, ease: "none", onUpdate: () => render(clock.t) }, 0);
      render(0);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
